# OWASP ZAP baseline (passive) scan of the live site.
#
# Thresholds live in .zap/rules.tsv: the checks this site has explicitly
# hardened (CSP, HSTS, anti-clickjacking, content-type sniffing) are set
# to FAIL; everything else reports as WARN without failing the job. The
# report is uploaded as an artifact on every run.
name: Security — ZAP baseline

on:
  schedule:
    - cron: "23 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP baseline against https://qompass.ai
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: "https://qompass.ai"
          rules_file_name: ".zap/rules.tsv"
          allow_issue_writing: false
          fail_action: true
          artifact_name: "zap-baseline-report"
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: zap-baseline-files
          path: |
            report_html.html
            report_md.md
            report_json.json
          if-no-files-found: ignore
