# Dependency policy. Run with: cargo deny check
# Skeleton adapted from the estate deny policy: licenses Apache-2.0-compatible,
# sources locked to crates.io, advisory ignores only with a named reason + TODO.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 — `paste` is unmaintained (author archived it), not
    # vulnerable. It reaches this tree only transitively (leptos ->
    # either_of -> paste) as a compile-time proc-macro; no fixed release
    # exists. TODO: remove this ignore when leptos drops the paste
    # dependency (or moves to the pastey fork).
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
deny = [
    { name = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
