[package]
name = "qompass-ai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Qompass AI website - Leptos SSG (Rust/WASM), served by vongola"
keywords = ["qompass", "leptos", "website", "post-quantum"]
categories = ["web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "qompass-ai"
required-features = ["ssr"]

[dependencies]
axum = { version = "0.8", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
leptos = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", features = ["Clipboard", "Event", "EventTarget", "MediaQueryList", "Navigator", "Window"], optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Node", "Window"] }

[features]
default = []
hydrate = [
    "dep:console_error_panic_hook",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
    "leptos/hydrate",
]
ssr = [
    "dep:axum",
    "dep:leptos_axum",
    "dep:tokio",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
assets-dir = "public"
bin-features = ["ssr"]
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
lib-features = ["hydrate"]
output-name = "qompass-ai"
reload-port = 3001
site-addr = "127.0.0.1:3000"
site-pkg-dir = "pkg"
site-root = "target/site"
style-file = "style/main.css"

[profile.release]
lto = "fat"
opt-level = "z"

[build-dependencies]
ammonia = "4"
pulldown-cmark = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Lint policy (estate starter, per the strict-clippy-burndown skill):
# groups at negative priority so the explicit per-lint policy always wins.
[lints.clippy]
all = { level = "warn", priority = -2 }
cargo = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
# deny: correctness / panics / safety — never relaxed
as_underscore = "deny"
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
disallowed_macros = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
enum_glob_use = "deny"
exit = "deny"
expect_used = "deny"
float_cmp = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
infinite_loop = "deny"
large_stack_arrays = "deny"
lossy_float_literal = "deny"
mem_forget = "deny"
missing_safety_doc = "deny"
mutex_atomic = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"
# this crate's stdout is build.rs cargo directives + the server bind line
print_stdout = "allow"
# wasm rule: never const-fn a wasm-gated body (see the burndown skill)
missing_const_for_fn = "allow"
# permanent allows — intentional choices
allow_attributes = "allow"
allow_attributes_without_reason = "allow"
cargo_common_metadata = "allow"
cognitive_complexity = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"

[lints.rust]
unsafe_code = "forbid"
irrefutable_let_patterns = "deny"
let_underscore_lock = "deny"
macro_use_extern_crate = "deny"
non_ascii_idents = "deny"
unit_bindings = "deny"
unused_lifetimes = "deny"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"
