# Clippy configuration for qompass-ai. Policy rationale: the strict deny set
# lives in Cargo.toml [lints]; this file makes that policy livable (tests may
# use what src may not) and sets the complexity ratchets.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Ratchet thresholds. Lower values catch complexity before review.
avoid-breaking-exported-api = false
too-many-arguments-threshold = 8
too-many-lines-threshold = 120
type-complexity-threshold = 250
cognitive-complexity-threshold = 30
excessive-nesting-threshold = 6
future-size-threshold = 16384
stack-size-threshold = 262144
check-private-items = true

# Ban runtime APIs with unsafe or nondeterministic behavior.
disallowed-methods = [
  { path = "std::env::set_var", reason = "mutating process env at runtime is unsafe under async" },
  { path = "std::env::remove_var", reason = "mutating process env at runtime is unsafe under async" },
]
disallowed-types = [
  { path = "std::sync::RwLock", reason = "use async-aware lock or short non-async lock" },
]
