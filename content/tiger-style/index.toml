name = "TypeScript"
scope = "Write or review TypeScript code in Tiger Style: safety-first TypeScript standard with explicit contracts, assertions, bounded work, and disciplined ownership. Applies whenever TypeScript is written, regenerated, refactored, reviewed, or debugged under the strict profile (TS 5.9+ and ES2022), for Node services and Deno projects alike. Toolchain pairing: ts_ls (tsgo_ls, deno_ls for Deno) for LSP, prettier and biome for formatting, the Node DAP adapter for debugging. Covers contract-first design, strict null handling, exhaustive switches, bounded async work, and half-adversarial test splits. Catches any-casts, unhandled promises, and non-exhaustive narrowing."
