# Tiger Style language index. Scope lines are the SKILL.md frontmatter
# descriptions (first sentence) from ~/workspace/skills/tiger-style-*/ at
# import time; the guides beside this file are copied verbatim (frontmatter
# stripped). Aseprite has two reference documents, joined with a rule.

[[language]]
slug = "aseprite"
name = "Aseprite"
scope = "Drive Aseprite from the CLI and Lua in Tiger Style: headless batch exports, sprite-sheet pipelines, and scripted pixel work with explicit contracts, version guards, and a documented LibreSprite divergence table."
has_reference = true

[[language]]
slug = "bash"
name = "Bash"
scope = "Write or review Bash scripts in Tiger Style: safety-first shell standard with explicit contracts, strict mode, bounded work, and disciplined quoting."
has_reference = true

[[language]]
slug = "c"
name = "C"
scope = "Write or review C code in Tiger Style: safety-first C standard with explicit contracts, assertions, bounded work, and disciplined manual memory ownership. Applies whenever C code is written, regenerated, refactored, reviewed, or debugged - from systems libraries and POSIX/Linux adapters to embedded targets. Toolchain pairing: clangd for LSP (diagnostics, completions, code actions), clang-format for formatting, lldb-dap for DAP debugging. Covers contract-first design, error-code discipline, no hidden allocation, bounded loops and buffers, and half-adversarial test splits. Hardens against buffer overflows, use-after-free, and integer overflow."
has_reference = true

