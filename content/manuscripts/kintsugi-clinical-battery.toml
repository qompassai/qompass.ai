slug = "kintsugi-clinical-battery"
ready = true
why = "The flagship results in clinical language modelling come from institutions that can afford the hardware: one widely cited health-system model was pretrained on 24 graphics processors for three weeks, an amount of computation its own authors noted is not commonly accessible. Most hospitals will never run anything like it. What they could run is a team of small models on a workstation they already own — if a team, properly assembled, produces enough.\n\nThis study tests that directly. A fixture battery of three clinical text tasks (guideline question answering, encounter digest, triage labelling) is run by three arms on identical held-out fixtures: a team of small models whose seats are filled by a pre-registered roster rule — the model that produces the most per unit of computing cost on a qualifying set takes the seat — one large model, and the best single small model. Everything is served as it would be deployed, at temperature zero, scoring first answers only. Production is the primary outcome, and the resource envelope (bytes on disk, peak memory, processor throughput) is co-primary, because a result a hospital cannot run is not a result for that hospital."
graphic = "kintsugi-battery"
