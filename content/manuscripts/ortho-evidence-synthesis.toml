slug = "ortho-evidence-synthesis"
ready = true
why = "Surgeons disagree about a concrete question: after a primary hip or knee replacement, does extending oral antibiotic prophylaxis beyond the standard first day reduce prosthetic joint infection — or does it mainly buy adverse drug events and resistance pressure? The trials are small, the observational studies are confounded by indication (sicker patients get longer courses), and the answer matters to every arthroplasty service.\n\nThis study answers the clinical question with a systematic review and meta-analysis reported to PRISMA 2020, with prespecified duration subgroups and explicit handling of confounding by indication — and it runs the review itself on a validated local pipeline. A team of small language models on an ordinary workstation, with no patient data and no cloud service, performs deduplication, screening and structured extraction under a deterministic record, and the paper reports the pipeline's validation (agreement with human reviewers, with confidence intervals) beside the clinical findings, so other groups can judge both the answer and the instrument that produced it."
sources_note = "Anchor sources for this study, verified against the Crossref registry (existence and title match) on 2026-10-20."

