slug = "compute-value-accounting"
ready = true
why = "Hospitals choosing clinical AI rarely see its cost expressed per correct output, so model reputation and size stand in for value — the same market failure that baseball's Moneyball era exposed, where production the statistics showed was priced below reputation the market believed.\n\nThis analysis prices the alternatives properly. On identical clinical text fixtures (guideline question answering, encounter digest, triage labelling), it measures production — correct outputs per thousand tasks — for a team of small models running on existing hospital workstations, against a single large model served on premises and through a commercial cloud service. Costs are counted the way a value analysis committee counts an implant: hardware amortisation, electricity, maintenance, staff time and usage fees, reported to CHEERS 2022, with the incremental cost per additional correct output as the primary outcome and sensitivity analyses across willingness-to-pay values."
graphic = "moneyball-roster"
sources_note = "Anchor sources for this study, verified against the Crossref registry (existence and title match) on 2026-10-20."

