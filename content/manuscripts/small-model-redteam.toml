slug = "small-model-redteam"
ready = true
why = "Small language models that run on a hospital's own computers are an affordable route to clinical AI, but how they fail under adversarial pressure — and whether those failures can be contained — has not been measured. Safety science's position is that failures should be classified, counted and monitored, not merely anticipated: an implant is not cleared because its designers meant well, and a model should not be either.\n\nThis study red-teams small clinical models (at most eight billion parameters, served on a processor) with a pre-specified battery of adversarial probes on clinical text: requests for unsupported facts and citations, user pushback against correct answers, instructions injected into clinical documents, misleading premises and omission pressure. Every response is assigned to a fixed failure taxonomy and graded for potential harm. Three configurations face identical probes — a single small model, a team with peer cross-checking, and a team whose claims are additionally verified against the source document by deterministic rules — so the mitigations are measured, not asserted."
sources_note = "Sources for this study, verified against the Crossref and DataCite registries (existence and title match) on 2026-10-20; reports and software are cited to their publishers."

