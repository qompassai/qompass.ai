slug = "resident-local-models"
ready = true
why = "Residents study and seek feedback in fragments of time, often on personal devices, and increasingly with cloud chatbots that send their text — sometimes including clinical details — to remote servers. A small language model that runs entirely on a resident's own laptop could provide retrieval practice and structured written feedback with no network access, no subscription cost and no data leaving the device. Whether residents will install it, keep using it, and be able to trust what it produces is unknown.\n\nThis single-program feasibility study puts the tool in residents' hands for twelve weeks, configured to generate questions from their own notes and to give structured feedback on written explanations. Feasibility is judged against prespecified progression criteria, not impressions: enrollment, installation success inside the model's memory envelope, weekly use, acceptability and usability scores, the factual error rate of audited outputs, and any events of patient information being entered — reported whichever way they fall."
sources_note = "Sources for this study, verified against the Crossref and DataCite registries (existence and title match) on 2026-10-20; reports and software are cited to their publishers."

