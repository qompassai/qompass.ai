slug = "kintsugi-protocol"
ready = true
why = "Clinical AI is moving from single models to pipelines in which several agents share work — one summarises a referral, another assigns urgency, a third drafts a reply. Such pipelines inherit the coordination problem clinical teams know from handoffs: an agent can receive a goal without taking it up, and two agents can act on divergent readings of the same task with neither noticing. Medicine's fixes are known — the structured handoff that cut medical errors by 23 percent, the surgical time-out — and both work by making the receiver restate the plan before acting.\n\nThe protocol in this paper separates commitment from perception. A deterministic, append-only record holds every commitment: who holds a work item, in what phase, under what contention. Small language models act only as the perceptual layer: each compresses the record into a schema-bound goal-state and must produce a canonical uptake restatement that matches the record and the other agents before it may act. Divergence is written to the record as an event and repaired in the open, never erased, and the responsibility a model may hold widens only over measured evidence and narrows on any factual failure. The paper specifies the protocol formally, maps it to a clinical referral pipeline, and pre-specifies its validation."
sources_note = "Anchor sources for this study, verified against the Crossref registry (existence and title match) on 2026-10-20."

