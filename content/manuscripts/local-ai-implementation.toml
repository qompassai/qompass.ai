slug = "local-ai-implementation"
ready = true
why = "Clinical AI is usually implemented through cloud services or graphics-processor servers that resource-limited institutions cannot buy, staff or govern. Small language models now run on ordinary workstation processors — but reports of how such a deployment is actually stood up, governed and kept safe are lacking, and implementation is where clinical AI most often quietly fails.\n\nThis SQUIRE 2.0 report describes standing up a governed small-model clinical text service on existing workstations: a team of small open-weight models, each assigned one task (guideline question answering, encounter digest, triage labelling) by measured production per unit of computing cost, running under a deterministic append-only protocol that admits a model's output only when it matches the record and agrees with its peers, and fails closed otherwise. Deployment proceeded through a five-step qualification ladder with explicit promotion and demotion rules. The report gives the implementation outcomes, the process measures, and the failure record by class — the part of an implementation that is usually edited out."
sources_note = "Sources for this study, verified against the Crossref and DataCite registries (existence and title match) on 2026-10-20; reports and software are cited to their publishers."

