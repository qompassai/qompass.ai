slug = "ai-tutors-med-ed"
ready = true
why = "Medical learners already study with general-purpose chatbots, usually through cloud services that send their questions, notes and sometimes clinical details to a remote server. Small language models that run on an ordinary laptop change the arrangement: the learner's text stays on the learner's device, the tool costs nothing to run after download, and it works with no network connection at all.\n\nThese tools are not tutors, and they make the same classes of error as larger models — fabrication, agreement with a wrong answer, inherited bias. So the question for educators is not whether learners will use them, but how to use them so they strengthen learning rather than replace it. This article gives twelve practical tips, drawn from the learning sciences, from published evaluations of language models in medicine, and from our own measurements of small models on a single workstation: ground answers in sources, make the model ask rather than tell, space the practice, structure the feedback, teach the failure modes, and test for sycophancy."
sources_note = "Anchor sources for this study, verified against the Crossref registry (existence and title match) on 2026-10-20."

