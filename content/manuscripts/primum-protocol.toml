slug = "primum-protocol"
ready = true
why = "Clinical workflows increasingly pass work between several AI agents, and every handoff is a chance for a wrong action to be taken on the wrong data by the wrong agent. Medicine manages the same risk with the surgical time-out and the structured handoff: a verification pause before the irreversible step. Agent workflows have no equivalent, and their failures are silent — an agent that misunderstood simply proceeds.\n\nPRIMUM places a time-out at every handoff. Tasks are allocated by sequential auction; monotone labels on data and destinations gate which agents may bid — a label can rise but never fall — and a deterministic decide() check runs at award and again at dispatch, because the world may have changed in between. Measured valuation, a backward-credit ledger and an anti-monopsony floor keep the market honest, consequential action classes require a signed manifest, and a human gatekeeper remains the floor throughout. The paper pre-registers a benchmark comparing workflows with the framework off and on across six harm fixtures, and reports a feasibility deployment on the author's own computing estate as the worked example."
sources_note = "Sources for this study, verified against the Crossref and DataCite registries (existence and title match) on 2026-10-20; reports and software are cited to their publishers."

